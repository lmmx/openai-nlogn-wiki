[project]
site_name = "Integer multiplication below n log n"
docs_dir = "docs"
nav = [
  "index.md",
  { "Background and computational model" = [
    "background-and-computational-model/index.md",
    { "Linear algebra over a field" = "linear-algebra.md" },
    { "Fixed-tape machine model" = "fixed-tape-machine.md" },
  ] },
  { "Linear networks that restore values" = [
    "linear-networks-that-restore-values/index.md",
    { "Linear network that restores auxiliary values" = "linear-network.md" },
  ] },
  { "Frames on network vertices" = [
    "frames-on-network-vertices/index.md",
    { "Frame of a network vertex" = "frame.md" },
  ] },
  { "Subset-intersection network and its count" = [
    "subset-intersection-network-and-its-count/index.md",
    { "Subset-intersection network" = "subset-network.md" },
  ] },
  { Notation = "notation.md" },
]
extra_javascript = ["javascripts/mathjax.js", "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", "javascripts/exegenius.js"]
extra_css = ["stylesheets/exegenius.css"]

[project.theme]
features = ["content.tooltips", "navigation.footer", "navigation.indexes", "navigation.instant", "navigation.instant.progress", "navigation.path", "navigation.sections", "navigation.top", "navigation.tracking", "search.highlight", "toc.follow"]
