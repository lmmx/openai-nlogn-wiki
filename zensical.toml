[project]
site_name = "Integer multiplication below n log n"
docs_dir = "docs"
nav = [
  "index.md",
  { "Integer products as convolutions" = [
    "integer-products-as-convolutions/index.md",
    { "Exact integer multiplication" = "exact-integer-multiplication.md" },
    { "Radix-digit convolution" = "radix-digit-convolution.md" },
  ] },
  { "Resampling between power-of-two lengths" = [
    "resampling-between-power-of-two-lengths/index.md",
    { "Gaussian resampling" = "gaussian-resampling.md" },
  ] },
  { "Chinese-remainder relabeling" = [
    "chinese-remainder-relabeling/index.md",
    { "Chinese-remainder map" = "chinese-remainder-map.md" },
  ] },
  { "Choosing prime source lengths" = [
    "choosing-prime-source-lengths/index.md",
    { "Prime source lengths" = "prime-source-lengths.md" },
  ] },
]
extra_javascript = ["javascripts/mathjax.js", "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", "javascripts/exegenius.js"]
extra_css = ["stylesheets/exegenius.css"]

[project.theme]
features = ["content.tooltips", "navigation.footer", "navigation.indexes", "navigation.instant", "navigation.instant.progress", "navigation.path", "navigation.sections", "navigation.top", "navigation.tracking", "search.highlight", "toc.follow"]
