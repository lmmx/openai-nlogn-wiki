[project]
site_name = "Integer multiplication below n log n"
docs_dir = "docs"
nav = [
  "index.md",
  { "Multiplication as convolution" = [
    "multiplication-as-convolution/index.md",
    { "Exact integer multiplication" = "exact-integer-multiplication.md" },
    { "Radix-digit convolution" = "radix-digit-convolution.md" },
  ] },
  { "Cyclic convolution and transforms" = [
    "cyclic-convolution-and-transforms/index.md",
    { "Cyclic convolution" = "cyclic-convolution.md" },
    { "Discrete Fourier transform" = "discrete-fourier-transform.md" },
  ] },
  { "Operator norms and contractions" = [
    "operator-norms-and-contractions/index.md",
    { "Operator norm" = "operator-norm.md" },
  ] },
  { "Gaussian resampling" = [
    "gaussian-resampling-2/index.md",
    { "Gaussian resampling" = "gaussian-resampling.md" },
  ] },
  { "Transform identity with permutations" = [
    "transform-identity-with-permutations/index.md",
    { "Transform identity with retained permutations" = "transform-identity.md" },
  ] },
  { Notation = "notation.md" },
]
extra_javascript = ["javascripts/mathjax.js", "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", "javascripts/exegenius.js"]
extra_css = ["stylesheets/exegenius.css"]

[project.theme]
features = ["content.tooltips", "navigation.footer", "navigation.indexes", "navigation.instant", "navigation.instant.progress", "navigation.path", "navigation.sections", "navigation.top", "navigation.tracking", "search.highlight", "toc.follow"]
